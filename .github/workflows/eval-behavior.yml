name: Behavioral evaluation

on:
  workflow_dispatch:
    inputs:
      target_provider:
        description: Provider/model tested by Promptfoo
        required: true
        default: openai:gpt-5-mini
        type: string
      grader_provider:
        description: Independent grader when available
        required: true
        default: openai:gpt-5-mini
        type: string
      repeat:
        description: Runs per case (1 for smoke, 3 for release)
        required: true
        default: '1'
        type: choice
        options: ['1', '3', '5']
      case_filter:
        description: Regex opcional para casos (exemplo ORQ-02|ORQ-06)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate Markdown agents
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVAL_TARGET: ${{ inputs.target_provider }}
      EVAL_GRADER: ${{ inputs.grader_provider }}
      EVAL_REPEAT: ${{ inputs.repeat }}
      EVAL_FILTER: ${{ inputs.case_filter }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
      PROMPTFOO_DISABLE_SHARING: 'true'
      PROMPTFOO_DISABLE_REMOTE_GENERATION: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run behavioral evaluation
        run: npm run eval:behavior

      - name: Write run summary
        if: always()
        run: node tests/evals/write-summary.cjs

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-eval-${{ github.sha }}
          path: tests/results/
          if-no-files-found: warn
          retention-days: 30
